<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking</title>
    <link rel="icon" type="image/svg+xml" href="{{ request.script_root }}/static/trellis/booking.svg">
    <link rel="stylesheet" href="{{ request.script_root }}/static/trellis/trellis.css?v={{ version }}">
    <link rel="stylesheet" href="{{ request.script_root }}/static/css/booking.css?v={{ version }}">
</head>
<body class="tt{% if embed %} embedded{% endif %}">
{% if not embed %}
<header class="tt-bar">
    <a class="tt-home" href="{{ links.suite_home }}" title="All of Trellis Tools"><img src="{{ request.script_root }}/static/trellis/trellis.svg" alt=""><span>Trellis Tools</span></a>
    <a class="tt-module" href="{{ request.script_root }}/"><img src="{{ request.script_root }}/static/trellis/booking.svg" alt="">Booking</a>
    <nav class="tt-tabs">
        <a class="tt-tab view-tab" data-view="calendar" href="#calendar">Calendar</a>
        <a class="tt-tab view-tab" data-view="find" href="#find">Find a slot</a>
        <a class="tt-tab view-tab" data-view="mine" href="#mine">My bookings</a>
        {% if person.can_add %}<a class="tt-tab view-tab" data-view="manage" href="#manage">Rooms &amp; equipment</a>{% endif %}
    </nav>
    <nav class="tt-links">
        <a href="{{ links.notebook }}/" target="_blank" rel="noopener">Notebook ↗</a>
    </nav>
    <span class="tt-user">{{ person.username }}{% if person.labs %} · {{ person.labs[0].lab }}{% endif %}{% if person.is_admin %} · admin{% endif %}</span>
    <a class="tt-logout" href="{{ links.logout }}">Log out</a>
</header>
{% endif %}
<main class="main" id="main"></main>
<dialog id="dialog" class="dialog"></dialog>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script>
    window.BK = {
        base: {{ request.script_root | tojson }},
        notebook: {{ links.notebook | tojson }},
        person: {{ person.to_dict() | tojson }},
        embed: {{ 'true' if embed else 'false' }},
    };
</script>
<script src="{{ request.script_root }}/static/js/booking.js?v={{ version }}"></script>
</body>
</html>
